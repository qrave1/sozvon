<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sozvon SFU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { ink: '#e8edf7', panel: '#151b29', line: '#283248', accent: '#6d8cff' } } }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: #0b1020; color: #e8edf7; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 12px 18px; background: rgba(21, 27, 41, .94); border-bottom: 1px solid #283248; }
    input, select, button { font: inherit; }
    header input { width: min(190px, 100%); padding: 9px 11px; border: 1px solid #34405a; border-radius: 10px; background: #0f1627; color: #fff; outline: none; }
    header input:focus, select:focus { border-color: #6d8cff; box-shadow: 0 0 0 3px rgba(109,140,255,.18); }
    button { padding: 9px 13px; border: 1px solid transparent; border-radius: 10px; background: #617ff5; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; transition: background .16s, transform .16s; }
    button:hover:not(:disabled) { background: #7892ff; transform: translateY(-1px); }
    button:disabled { opacity: .5; cursor: default; }
    button[aria-pressed="true"] { background: #555; }
    #leave { background: #d34d5a; }
    #status { margin-left: auto; font-size: 13px; opacity: .85; }
    .device-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 18px; background: #101728; border-bottom: 1px solid #283248; }
    .device-bar label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .device-bar select { max-width: 170px; padding: 7px 9px; border: 1px solid #34405a; border-radius: 9px; background: #0f1627; color: #fff; }
    .device-bar select:disabled { opacity: .5; }
    #videos { --pad: 18px; --gap: 12px; --strip: 210px; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); grid-auto-rows: minmax(180px, 1fr); gap: var(--gap); padding: var(--pad); overflow: auto; }
    #videos:empty { display: none; }
    #room-content { flex: 1; min-height: 0; display: flex; }
    #chat-panel { width: min(340px, 35vw); min-width: 260px; display: none; flex-direction: column; border-left: 1px solid #283248; background: #101728; }
    #room-content.chat-open #chat-panel { display: flex; }
    #chat-messages { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
    .chat-message { margin-bottom: 12px; overflow-wrap: anywhere; }
    .chat-message header { padding: 0; border: 0; background: none; font-size: 12px; }
    .chat-message time { margin-left: auto; color: #94a3b8; font-size: 11px; }
    #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #283248; }
    #chat-input { flex: 1; min-width: 0; padding: 9px; border: 1px solid #34405a; border-radius: 10px; background: #0b1020; color: #fff; }
    #room-tabs { display: none; }
    #welcome { display: grid; place-items: center; flex: 1; min-height: 0; padding: 24px; }
    #welcome .welcome-card { width: min(100%, 520px); padding: 32px; border: 1px solid #283248; border-radius: 24px; background: linear-gradient(145deg, rgba(21,27,41,.96), rgba(15,22,39,.92)); box-shadow: 0 24px 70px rgba(0,0,0,.28); text-align: center; }
    #welcome[hidden] { display: none; }
    #videos.spotlight { position: relative; grid-template-columns: 1fr var(--strip); grid-auto-rows: min-content; overflow: hidden; }
    #videos.spotlight .tile.active-lg { position: absolute; inset: var(--pad) calc(var(--pad) + var(--strip) + var(--gap)) var(--pad) var(--pad); width: auto; height: auto; z-index: 1; }
    #videos.spotlight .tile:not(.active-lg) { grid-column: 2; min-height: 0; max-height: 130px; aspect-ratio: 4 / 3; }
    #videos.spotlight .tile:not(.active-lg) video { object-fit: cover; }
    .tile { position: relative; min-height: 180px; background: #05070d; border: 1px solid #283248; border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: 0 12px 30px rgba(0,0,0,.2); }
    .tile video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .tile:fullscreen { border-radius: 0; }
    .tile.speaking { box-shadow: inset 0 0 0 3px #2ecc71; }
    .tile .avatar { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 48px; font-weight: 700; }
    .tile .label { position: absolute; bottom: 6px; left: 8px; max-width: calc(100% - 65px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 2px 8px; border-radius: 4px; background: rgba(0, 0, 0, .65); font-size: 12px; }
    .tile .badge { position: absolute; top: 6px; right: 8px; padding: 2px 8px; border-radius: 4px; background: rgba(0, 0, 0, .65); font-size: 11px; }
    .tile .peer-mute, .tile .peer-fullscreen { position: absolute; z-index: 2; padding: 2px 7px; border-radius: 4px; background: rgba(0, 0, 0, .65); font-size: 12px; }
    .tile .peer-mute { top: 6px; left: 8px; }
    .tile .peer-fullscreen { bottom: 6px; right: 8px; }
    .tile .peer-volume { position: absolute; z-index: 2; top: 8px; right: 8px; width: 110px; height: 24px; accent-color: #6d8cff; cursor: pointer; filter: drop-shadow(0 1px 3px #000); }
    @media (max-width: 600px) {
      header { padding: 8px; gap: 6px; }
      header > div:first-child, header > div:nth-child(2), header > div:nth-child(3) { width: 100%; }
      header > div:nth-child(3) { justify-content: stretch; }
      header > div:nth-child(3) button { flex: 1; min-width: 0; padding-inline: 8px; }
      header input { flex: 1 1 120px; width: 0; }
      #status { width: 100%; margin-left: 0; text-align: center; }
      #videos { --pad: 8px; --gap: 8px; --strip: 112px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); grid-auto-rows: minmax(140px, 1fr); }
      #room-tabs { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid #283248; background: #101728; }
      #room-tabs button { flex: 1; }
      #chat-toggle { display: none; }
      #room-content.chat-active #videos { display: none; }
      #room-content.chat-active #chat-panel { display: flex; }
      #room-content:not(.chat-active) #chat-panel { display: none; }
      #chat-panel { width: 100%; min-width: 0; border-left: 0; }
      .tile { min-height: 140px; border-radius: 12px; }
      .tile .label { left: 5px; bottom: 5px; max-width: calc(100% - 10px); font-size: 11px; }
      .tile .peer-mute, .tile .peer-fullscreen { opacity: 1; }
      .device-bar { padding: 8px; gap: 7px; }
      .device-bar label { width: 100%; justify-content: space-between; }
      .device-bar select { flex: 1; max-width: none; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      #videos { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div class="flex flex-1 flex-wrap items-center gap-2">
      <button id="leave" class="inline-flex items-center justify-center gap-2 rounded-xl bg-rose-500 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-300 disabled:cursor-not-allowed disabled:opacity-50" hidden>Выйти</button>
    </div>
    <div class="flex items-center gap-2">
      <button id="mic" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent disabled:cursor-not-allowed disabled:opacity-40" aria-pressed="false" title="Микрофон" aria-label="Переключить микрофон">🎤</button>
      <button id="cam" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent disabled:cursor-not-allowed disabled:opacity-40" aria-pressed="true" title="Камера" aria-label="Переключить камеру">📹</button>
      <button id="screen" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent disabled:cursor-not-allowed disabled:opacity-40" hidden title="Демонстрация экрана" aria-label="Демонстрация экрана">🖥</button>
      <button id="share" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent disabled:cursor-not-allowed disabled:opacity-40" hidden title="Скопировать ссылку" aria-label="Скопировать ссылку">🔗</button>
      <button id="chat-toggle" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent" type="button" aria-expanded="false" aria-controls="chat-panel" hidden>💬 Чат</button>
      <button id="settings" class="inline-flex min-h-10 items-center justify-center rounded-xl border border-line bg-slate-800/80 px-3 text-sm text-slate-100 transition hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-accent disabled:cursor-not-allowed disabled:opacity-40" aria-pressed="false" title="Настройки устройств" aria-label="Настройки устройств">⚙</button>
    </div>
    <span id="status" class="rounded-full border border-line bg-slate-900/70 px-3 py-1 text-xs font-medium text-slate-300" role="status" aria-live="polite">Не подключено</span>
  </header>
  <div id="device-bar" class="device-bar shadow-inner" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
    <div class="flex w-full items-center justify-between"><button id="settings-close" class="rounded-lg px-2 py-1 text-slate-300 hover:bg-slate-700" aria-label="Закрыть настройки">✕</button></div>
    <label class="flex items-center gap-2">🎤 <select class="min-w-40" id="audio-input" aria-label="Микрофон"></select></label>
    <label class="flex items-center gap-2">🔊 <select class="min-w-40" id="audio-output" aria-label="Аудиовыход" title="Доступно не во всех браузерах"></select></label>
    <label class="flex items-center gap-2">📷 <select class="min-w-40" id="video-input" aria-label="Камера"></select></label>
    <label class="flex items-center gap-2">🎨 <select id="color" aria-label="Цвет аватара">
      <option value="">Авто</option>
      <option value="#e74c3c">Красный</option><option value="#3498db">Синий</option>
      <option value="#2ecc71">Зелёный</option><option value="#9b59b6">Фиолетовый</option>
      <option value="#f1c40f">Жёлтый</option><option value="#1abc9c">Бирюзовый</option>
      <option value="#e67e22">Оранжевый</option><option value="#34495e">Тёмно-серый</option>
      <option value="#fd79a8">Розовый</option><option value="#00cec9">Аква</option>
    </select></label>
    <label class="flex items-center gap-2">📶 <select id="bitrate" aria-label="Качество видео">
      <option value="low">Низкое</option><option value="medium">Среднее</option><option value="high">Высокое</option>
    </select></label>
  </div>
  <section id="welcome" aria-labelledby="welcome-title">
    <div class="welcome-card">
      <div class="mx-auto mb-5 grid h-16 w-16 place-items-center rounded-2xl bg-accent text-2xl font-bold text-white shadow-lg shadow-indigo-950/40">S</div>
      <h1 id="welcome-title" class="mb-2 text-2xl font-semibold text-white">Добро пожаловать в Sozvon</h1>
      <p class="mb-6 text-sm leading-6 text-slate-400">Введите имя и ID комнаты, чтобы присоединиться к видеозвонку. Камеру и микрофон можно настроить после входа.</p>
      <div class="mb-4 flex flex-col gap-2 text-left sm:flex-row">
        <label class="flex-1 text-xs font-medium text-slate-400">Ваше имя<input id="name" class="mt-1 w-full rounded-xl border border-line bg-slate-950/60 px-3 py-2 text-sm text-white outline-none focus:border-accent" aria-label="Ваше имя" placeholder="Яша Лава" maxlength="64"></label>
        <label class="flex-1 text-xs font-medium text-slate-400">ID комнаты<input id="room" class="mt-1 w-full rounded-xl border border-line bg-slate-950/60 px-3 py-2 text-sm text-white outline-none focus:border-accent" aria-label="ID комнаты" placeholder="123" maxlength="128"></label>
      </div>
      <button id="join" class="w-full rounded-xl bg-accent px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-300">Войти в комнату</button>
    </div>
  </section>
  <nav id="room-tabs" aria-label="Вкладки комнаты" hidden>
    <button id="video-tab" type="button" aria-pressed="true">Видео</button>
    <button id="chat-tab" type="button" aria-pressed="false">Чат</button>
  </nav>
  <div id="room-content" hidden>
    <main id="videos" aria-label="Участники комнаты"></main>
    <aside id="chat-panel" aria-label="Чат комнаты">
      <div id="chat-messages" aria-live="polite" aria-relevant="additions text"></div>
      <form id="chat-form">
        <input id="chat-input" maxlength="4000" autocomplete="off" placeholder="Сообщение…" aria-label="Сообщение">
        <button type="submit">Отправить</button>
      </form>
    </aside>
  </div>
  <div id="toast" class="pointer-events-none fixed bottom-14 left-1/2 z-20 hidden -translate-x-1/2 rounded-xl border border-line bg-slate-900/95 px-4 py-3 text-sm text-white shadow-xl" role="alert" aria-live="assertive"></div>
  <footer class="border-t border-line bg-panel px-4 py-2 text-center text-xs text-slate-400">Нажмите на видео, чтобы открыть spotlight-режим</footer>
  <script src="/sfu.js"></script>
</body>
</html>
