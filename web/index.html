<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sozvon</title>
  <style>
    * { box-sizing: border-box; }
    [x-cloak] { display: none !important; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      background: #1a1d24;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    header input {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #11131a;
      color: #fff;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #2f6feb;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:disabled { opacity: .5; cursor: default; }
    button.danger { background: #c0392b; }
    button.off { background: #555; }
    #status { margin-left: auto; font-size: 13px; opacity: .8; }
    #videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      grid-auto-rows: minmax(180px, 1fr);
      gap: 10px;
      padding: 16px;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    #videos.spotlight {
      grid-template-columns: 1fr 200px;
      grid-template-rows: 1fr;
      grid-auto-rows: min-content;
      overflow: hidden;
    }
    #videos.spotlight .tile.active-lg {
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      height: 100%;
    }
    #videos.spotlight .tile.active-lg video {
      object-fit: contain;
      background: #0f1115;
    }
    #videos.spotlight .tile:not(.active-lg) {
      grid-column: 2;
      max-height: 130px;
      aspect-ratio: 4 / 3;
    }
    #videos.spotlight .tile:not(.active-lg) video {
      object-fit: cover;
    }
    .tile {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    .tile video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .tile .label {
      position: absolute;
      bottom: 6px; left: 8px;
      font-size: 12px;
      background: rgba(0,0,0,.5);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .tile .badge {
      position: absolute;
      top: 6px; right: 8px;
      font-size: 11px;
      background: rgba(0,0,0,.5);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .tile .badge.net { top: 30px; }
    .tile .badge.net.net-good { color: #2ecc71; }
    .tile .badge.net.net-fair { color: #f1c40f; }
    .tile .badge.net.net-poor { color: #e74c3c; }
    .tile .peer-mute {
      position: absolute;
      top: 6px; left: 8px;
      padding: 2px 7px;
      font-size: 12px;
      background: rgba(0,0,0,.55);
      border-radius: 4px;
      border: none;
      cursor: pointer;
      z-index: 2;
    }
    .tile .peer-fullscreen {
      position: absolute;
      bottom: 6px; right: 8px;
      padding: 2px 7px;
      font-size: 12px;
      background: rgba(0,0,0,.55);
      border-radius: 4px;
      border: none;
      cursor: pointer;
      z-index: 2;
    }
    .tile:fullscreen {
      border-radius: 0;
      background: #000;
    }
    .tile .label .mic-off {
      margin-left: 4px;
      opacity: .9;
    }
    .tile.speaking {
      box-shadow: inset 0 0 0 3px #2ecc71;
    }
    .avatar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      color: #fff;
    }
    .controls { padding: 0 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .device-bar {
      padding: 0 16px 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .device-bar label {
      font-size: 12px;
      opacity: .7;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .device-bar select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #11131a;
      color: #fff;
      font-size: 12px;
      max-width: 180px;
    }
    .device-bar select:disabled { opacity: .4; cursor: default; }
    @media (max-width: 600px) {
      header { padding: 8px; }
      #videos {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        padding: 8px;
        gap: 8px;
      }
    }
  </style>
</head>
<body x-data="callApp()" x-init="init()">
  <header>
    <input x-model="name" placeholder="Ваше имя" aria-label="Ваше имя" :disabled="connected" />
    <input x-model="room" placeholder="ID комнаты" aria-label="ID комнаты" :disabled="connected" />
    <button x-cloak x-show="!connected" :disabled="connecting" @click="join()"
            x-text="connecting ? '⏳ Подключение…' : '➡ Войти'"></button>
    <button class="danger" x-cloak x-show="connected" @click="leave()">⬅ Выйти</button>
    <button :class="micOn ? '' : 'off'" @click="toggleMic()" x-text="micOn ? '🎤 Микрофон' : '🔇 Микрофон'" :aria-pressed="!micOn" aria-label="Переключить микрофон"></button>
    <button :class="camOn ? '' : 'off'" @click="toggleCam()" x-text="camOn ? '📹 Камера' : '🚫 Камера'" :aria-pressed="!camOn" aria-label="Переключить камеру"></button>
    <button x-cloak :class="screenShare ? '' : 'off'" x-show="connected" @click="toggleScreen()" x-text="screenShare ? '🖥 Экран: вкл' : '🖥 Экран'" :aria-pressed="screenShare" aria-label="Переключить демонстрацию экрана"></button>
    <button x-cloak x-show="connected" @click="share()" aria-label="Скопировать ссылку на комнату">🔗 Поделиться</button>
    <button @click="showSettings = !showSettings" :class="showSettings ? '' : 'off'" :aria-pressed="showSettings" title="Настройки устройств" aria-label="Настройки устройств">⚙️</button>
    <span id="status" x-text="status" role="status" aria-live="polite"></span>
  </header>

  <div class="device-bar" x-cloak x-show="showSettings" x-transition:enter.duration.200ms x-transition:leave.duration.150ms>
    <label>🎤
      <select x-model="audioInputId" @change="changeDevice('audioinput')">
        <template x-for="d in devices.audioinput" :key="d.deviceId">
          <option :value="d.deviceId" x-text="d.label || d.deviceId.slice(0,12) + '…'"></option>
        </template>
      </select>
    </label>
    <label>🔊
      <select x-model="audioOutputId" @change="changeDevice('audiooutput')"
              :disabled="!audioOutputSupported || !devices.audiooutput.length"
              title="Выбор аудиовыхода поддерживается не во всех браузерах">
        <template x-for="d in devices.audiooutput" :key="d.deviceId">
          <option :value="d.deviceId" x-text="d.label || d.deviceId.slice(0,12) + '…'"></option>
        </template>
      </select>
    </label>
    <label>📷
      <select x-model="videoId" @change="changeDevice('videoinput')">
        <template x-for="d in devices.videoinput" :key="d.deviceId">
          <option :value="d.deviceId" x-text="d.label || d.deviceId.slice(0,12) + '…'"></option>
        </template>
      </select>
    </label>
    <label>🎨 Цвет
      <select x-model="prefColor" aria-label="Выбор цвета аватара">
        <option value="">Авто</option>
        <template x-for="c in colors" :key="c">
          <option :value="c" x-text="colorNames[c] || c" :style="'color:' + c"></option>
        </template>
      </select>
    </label>
    <label>🎞 Кодек
      <select x-model="codecPref" @change="changeCodec()">
        <option value="auto">Авто</option>
        <option value="vp8">VP8</option>
        <option value="vp9">VP9</option>
        <option value="h264">H264</option>
        <option value="av1">AV1</option>
      </select>
    </label>
  </div>

  <div id="videos" :class="activeId ? 'spotlight' : ''">
      <div class="tile" id="tile-local" x-cloak :class="[activeId === 'local' ? 'active-lg' : '', speaking ? 'speaking' : '']" @click="selectId('local')" x-show="connected">
      <video id="vid-local" autoplay playsinline muted x-show="camOn"></video>
      <div class="avatar" x-show="!camOn" :style="'background:' + myColor" x-text="initial"></div>
      <button class="peer-fullscreen" x-show="camOn" @click.stop="fullscreen('local')" title="Во весь экран" aria-label="Своё видео во весь экран">⛶</button>
      <div class="label">
        <span x-text="name || 'я'"></span>
        <span class="mic-off" x-show="!micOn" title="микрофон выключен">🔇</span>
      </div>
    </div>

    <template x-for="p in peers" :key="p.id">
      <div class="tile" :id="'tile-' + p.id" :class="[activeId === p.id ? 'active-lg' : '', p.speaking ? 'speaking' : '']" @click="selectId(p.id)">
        <video :id="'vid-' + p.id" autoplay playsinline x-show="p.camOn"></video>
        <div class="avatar" x-show="!p.camOn" :style="'background:' + p.color" x-text="p.initial"></div>
        <button class="peer-mute" :class="p.muted ? 'off' : ''" @click.stop="toggleMuteUser(p.id)"
                x-text="p.muted ? '🔇' : '🔊'"
                :title="p.muted ? 'Включить звук для себя' : 'Выключить звук для себя'"
                :aria-label="p.muted ? 'Включить звук для себя' : 'Выключить звук для себя'"></button>
        <button class="peer-fullscreen" x-show="p.camOn" @click.stop="fullscreen(p.id)" title="Во весь экран" aria-label="Видео участника во весь экран">⛶</button>
        <div class="label">
          <span x-text="p.name || p.id.slice(0, 8)"></span>
          <span class="mic-off" x-show="!p.micOn" title="микрофон выключен">🔇</span>
        </div>
        <div class="badge" x-show="p.mode" x-text="p.mode"></div>
        <div class="badge net" :class="'net-' + (p.level || 'good')" x-show="p.rtt !== null && p.rtt !== undefined" x-text="Math.round(p.rtt) + ' ms'"></div>
      </div>
    </template>
  </div>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/client.js"></script>
</body>
</html>
